<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gavel{% endblock %} · Live Auctions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee; --bg-2: #ece8df; --card: #ffffff; --text: #1d1a16; --muted: #6f685d;
    --line: #e2ddd2; --accent: #b8741a; --accent-ink: #ffffff; --accent-soft: #f6e9d4;
    --ink: #1f2a3a; --ok: #15803d; --ok-soft: #dcf3e3; --warn: #c2410c; --bad: #b42318; --bad-soft: #fde4e1;
    --shadow: 0 1px 2px rgba(30,25,15,.05), 0 8px 24px -12px rgba(30,25,15,.18);
    --radius: 14px;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12110f; --bg-2: #1a1916; --card: #1e1c19; --text: #efeae1; --muted: #a39c90;
      --line: #2f2c27; --accent: #e5a54b; --accent-ink: #1a1408; --accent-soft: #3a2b16;
      --ink: #0b0f16; --ok: #4ade80; --ok-soft: #14301e; --warn: #fb923c; --bad: #f87171; --bad-soft: #3b1a17;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 15px/1.55 var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  h1, h2, h3 { margin: 0; }

  /* top bar */
  .topbar { background: var(--ink); color: #f4efe6; }
  .topbar .inner { max-width: 1120px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  .brand svg { color: #e5a54b; }
  .topbar .spacer { flex: 1; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e5a54b; color: #1a1408; display: grid; place-items: center; font-weight: 700; text-transform: uppercase; }
  .role { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(255,255,255,.25); color: #e9dcc6; }
  .topbar form { margin: 0; }
  .link-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: #f4efe6; padding: 6px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; }
  .link-btn:hover { background: rgba(255,255,255,.08); }

  /* shared controls */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=number], input:not([type]) {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); font: inherit; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: 0; border-radius: 10px;
         background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s; text-decoration: none; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .muted { color: var(--muted); }
  .errorlist { list-style: none; padding: 8px 12px; margin: 8px 0 0; background: var(--bad-soft); color: var(--bad); border-radius: 8px; font-size: 13px; }
  .helptext { font-size: 12px; color: var(--muted); }
  .helptext ul { margin: 4px 0 0; padding-left: 18px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="{% url 'index' %}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m14 13-8.4 8.4a2 2 0 0 1-2.8-2.8L11.2 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/>
      </svg>
      Gavel
    </a>
    <div class="spacer"></div>
    {% if user.is_authenticated %}
      <div class="user">
        <div class="avatar">{{ user.username|first }}</div>
        <span>{{ user.username }}</span>
        {% if role %}<span class="role">{{ role|lower }}</span>{% endif %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-btn">Log out</button></form>
      </div>
    {% endif %}
  </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
